<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mr. LoreWeave | The Archive</title>

    <meta
        name="description"
        content="The official archive of Mr. LoreWeave. Stories, worlds, art, and records."
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #eee8f5;

            background:

                radial-gradient(
                    circle at 50% 20%,
                    rgba(91, 48, 130, 0.28),
                    transparent 38%
                ),

                radial-gradient(
                    circle at 15% 80%,
                    rgba(55, 20, 80, 0.20),
                    transparent 32%
                ),

                #07060a;

            overflow-x: hidden;

        }


        /* ATMOSPHERIC BACKGROUND */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.14;

            background-image:

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.8) 1px,
                    transparent 1px
                );

            background-size: 90px 90px;

            animation:
                particles 20s linear infinite;

        }


        @keyframes particles {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(90px);
            }

        }


        /* SOFT PURPLE GLOW */

        body::after {

            content: "";

            position: fixed;

            width: 500px;
            height: 500px;

            left: 50%;
            top: 45%;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(111, 58, 145, 0.10),
                    transparent 70%
                );

            pointer-events: none;

        }


        .page {

            min-height: 100vh;

            position: relative;

            z-index: 1;

            display: flex;

            flex-direction: column;

        }


        /* HEADER */

        header {

            width: 100%;

            padding:
                28px
                7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

        }


        .logo {

            color: #eee8f5;

            text-decoration: none;

            font-size: 0.95rem;

            letter-spacing: 0.22em;

            white-space: nowrap;

        }


        nav a {

            color: #8f8996;

            text-decoration: none;

            font-size: 0.72rem;

            letter-spacing: 0.16em;

            transition: 0.3s;

        }


        nav a:hover {

            color: #ffffff;

        }


        /* HERO */

        main {

            flex: 1;

        }


        .hero {

            min-height: 82vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                80px
                20px;

        }


        .hero-content {

            width: 100%;

            max-width: 900px;

            animation:
                appear 1.2s ease both;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(15px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .eyebrow {

            color: #a47bc2;

            font-size: 0.68rem;

            letter-spacing: 0.42em;

            text-transform: uppercase;

            margin-bottom: 26px;

        }


        h1 {

            font-size:
                clamp(
                    3.6rem,
                    11vw,
                    8rem
                );

            font-weight: 400;

            line-height: 0.9;

            letter-spacing: 0.08em;

            text-shadow:
                0 0 40px
                rgba(126, 70, 170, 0.22);

        }


        .subtitle {

            margin-top: 30px;

            color: #aaa3b2;

            font-size: 1rem;

            letter-spacing: 0.16em;

        }


        /* ENTER BUTTON */

        .enter-button {

            display: inline-block;

            margin-top: 46px;

            padding:
                16px
                34px;

            color: #eee8f5;

            text-decoration: none;

            font-size: 0.72rem;

            letter-spacing: 0.2em;

            border:
                1px solid
                rgba(169, 113, 202, 0.55);

            background:
                rgba(50, 20, 70, 0.18);

            transition:
                transform 0.35s,
                background 0.35s,
                border-color 0.35s,
                box-shadow 0.35s;

        }


        .enter-button:hover {

            transform:
                translateY(-3px);

            background:
                rgba(95, 39, 125, 0.30);

            border-color:
                rgba(195, 143, 222, 0.8);

            box-shadow:
                0 0 35px
                rgba(125, 70, 165, 0.22);

        }


        .enter-button:active {

            transform:
                translateY(0);

        }


        .hint {

            margin-top: 20px;

            color: #5f5965;

            font-size: 0.7rem;

            font-style: italic;

        }


        /* DECORATIVE LINE */

        .divider {

            width: 90px;

            height: 1px;

            margin:
                35px
                auto
                0;

            background:
                rgba(161, 112, 190, 0.45);

        }


        /* ABOUT */

        .about {

            max-width: 700px;

            margin:
                0
                auto;

            padding:
                90px
                25px;

            text-align: center;

            border-top:
                1px solid
                rgba(255,255,255,0.06);

        }


        .about h2 {

            font-size: 1.5rem;

            font-weight: 400;

            letter-spacing: 0.18em;

        }


        .about p {

            margin-top: 20px;

            color: #77717e;

            font-size: 0.9rem;

            line-height: 1.8;

        }


        /* FOOTER */

        footer {

            padding:
                28px
                7%;

            text-align: center;

            border-top:
                1px solid
                rgba(255,255,255,0.06);

            color: #504b55;

            font-size: 0.65rem;

            letter-spacing: 0.15em;

        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {

                padding:
                    22px
                    5%;

            }


            .logo {

                font-size: 0.78rem;

            }


            nav a {

                font-size: 0.65rem;

            }


            .hero {

                min-height: 78vh;

                padding:
                    60px
                    18px;

            }


            .subtitle {

                font-size: 0.82rem;

                letter-spacing: 0.1em;

            }


            .enter-button {

                padding:
                    15px
                    26px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- HEADER -->

    <header>

        <a
            href="index.html"
            class="logo"
        >
            MR. LOREWEAVE
        </a>


        <nav>

            <a href="#about">
                ABOUT
            </a>

        </nav>

    </header>



    <!-- MAIN -->

    <main>


        <!-- HERO -->

        <section class="hero">

            <div class="hero-content">


                <div class="eyebrow">
                    THE ARCHIVE
                </div>


                <h1>
                    LOREWEAVE
                </h1>


                <p class="subtitle">
                    Stories leave traces.
                </p>


                <div class="divider"></div>


                <!-- THIS BUTTON OPENS THE ARCHIVE PAGE -->

                <a
                    href="archive.html"
                    class="enter-button"
                >
                    ENTER THE ARCHIVE
                </a>


                <p class="hint">
                    Some records are better left unread.
                </p>


            </div>

        </section>



        <!-- ABOUT -->

        <section
            class="about"
            id="about"
        >

            <h2>
                ABOUT THE ARCHIVE
            </h2>


            <p>
                A growing collection of stories, artwork,
                strange records, and worlds created by
                Mr. LoreWeave.
            </p>

        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        © 2026 MR. LOREWEAVE
        ·
        THE ARCHIVE

    </footer>


</div>


</body>

</html>
